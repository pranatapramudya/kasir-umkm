<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accentBar)"/>
  
  <!-- Left accent stripe -->
  <rect x="0" y="0" width="12" height="630" fill="url(#accentBar)"/>
  
  <!-- Logo area -->
  <circle cx="100" cy="80" r="36" fill="#0369a1"/>
  <text x="100" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="white" text-anchor="middle">PJ</text>
  <text x="100" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">KASIR UMKM</text>
  
  <!-- Main content -->
  <text x="200" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#0f172a" text-anchor="start">Blog PJTECH</text>
  <text x="200" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Panduan POS, Tips Bisnis, Case Study</text>
  
  <!-- Price badge -->
  <rect x="200" y="190" width="280" height="48" rx="12" fill="#0369a1"/>
  <text x="340" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">Mulai Rp 990rb/tahun</text>
  <text x="340" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.8)" text-anchor="middle">All-in • Gratis 14 hari</text>
  
  <!-- Features grid -->
  <g font-family="system-ui, -apple-system, sans-serif">
    
        <rect x="200" y="310" width="300" height="60" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="230" cy="340" r="16" fill="#0369a120"/>
        <text x="230" y="345" font-size="16" font-weight="700" fill="#0369a1" text-anchor="middle">✓</text>
        <text x="265" y="346" font-size="15" font-weight="600" fill="#1e293b">Panduan Beli POS</text>
      
        <rect x="550" y="310" width="300" height="60" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="580" cy="340" r="16" fill="#0369a120"/>
        <text x="580" y="345" font-size="16" font-weight="700" fill="#0369a1" text-anchor="middle">✓</text>
        <text x="615" y="346" font-size="15" font-weight="600" fill="#1e293b">F&amp;B KDS Guide</text>
      
        <rect x="200" y="390" width="300" height="60" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="230" cy="420" r="16" fill="#0369a120"/>
        <text x="230" y="425" font-size="16" font-weight="700" fill="#0369a1" text-anchor="middle">✓</text>
        <text x="265" y="426" font-size="15" font-weight="600" fill="#1e293b">Jasa Tracking</text>
      
        <rect x="550" y="390" width="300" height="60" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="580" cy="420" r="16" fill="#0369a120"/>
        <text x="580" y="425" font-size="16" font-weight="700" fill="#0369a1" text-anchor="middle">✓</text>
        <text x="615" y="426" font-size="15" font-weight="600" fill="#1e293b">Rental Kalender</text>
      
  </g>
  
  <!-- CTA -->
  <rect x="200" y="490" width="480" height="56" rx="16" fill="url(#accentBar)"/>
  <text x="440" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle">Coba Gratis 14 Hari →</text>
  
  <!-- Bottom info -->
  <text x="1100" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">pjtechumkm.com • #1 POS UMKM Indonesia</text>
  
  <!-- Decorative elements -->
  <circle cx="1150" cy="150" r="80" fill="#0369a108"/>
  <circle cx="1100" cy="500" r="120" fill="#0284c706"/>
</svg>